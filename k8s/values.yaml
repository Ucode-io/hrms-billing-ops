# Кабинет оператора биллинга HRMS (статическая сборка Vite под nginx).
# Деплой: GitHub Ucode-io/hrms-billing-ops -> ghcr.io -> Ucode-io/deployments -> ArgoCD.
# No Vault: every VITE_* variable is baked into the bundle at build time, and the
# Vault sidecar would mount over /app and hide the nginx content.
global:
  replicaCount: 1
  environment: {}
replicaCount: 1
image:
  registry: ghcr.io/
  repository: ucode-io/hrms-billing-ops
  pullPolicy: IfNotPresent
  # Bumped by the deploy job to github.run_number on every master push.
  tag: "1"
imagePullSecrets: "ghcr-registry"
nameOverride: ""
fullnameOverride: ""
labels:
  app: hrms-billing-ops
serviceAccount:
  create: true
  annotations: {}
  name: "vault-auth"
podLabels:
  app: hrms-billing-ops
podSecurityContext: {}
securityContext: {}
vault:
  enabled: false
  secretName: vault-secrets
  variables:
    VAULT_TOKEN: vault_token
    SECRETS_PATH:
environment: {}
volumes:
  enabled: false
  pvc:
    enabled: false
    existing_claim:
    name: pvc
    mountPath: /pv
    size: 1G
    class:
    accessModes:
      - ReadWriteOnce
service:
  type: ClusterIP
  annotations: {}
  specs:
    - port: 80
      targetPort: 80
      name: https
ingress:
  enabled: true
  rules:
    - annotations:
        nginx.ingress.kubernetes.io/enable-cors: "true"
        nginx.ingress.kubernetes.io/cors-allow-origin: "*"
        nginx.ingress.kubernetes.io/cors-allow-methods: "PUT, GET, POST, OPTIONS, DELETE"
        kubernetes.io/ingress.class: nginx
        # Deliberately NOT setting acme.cert-manager.io/http01-edit-in-place:
        # this app syncs with selfHeal, so ArgoCD reverts the challenge path
        # cert-manager writes into this ingress and the validation never lands.
        # Without it cert-manager gets its own solver ingress, which ArgoCD
        # does not manage and does not touch.
        cert-manager.io/cluster-issuer: letsencrypt-prod
      type: web
      hosts:
        # ucode.co has no wildcard, so this host needs an A record at the
        # registrar pointing at the ingress, and its certificate is issued by
        # cert-manager rather than handed down by Cloudflare.
        - host: "billing.ucode.co"
          path: /
          servicePort: 80
      # The explicit tls block is required: cert-manager annotations alone
      # issue no certificate and the host quietly serves a self-signed one.
      tls:
        - secretName: billing-ucode-co-tls
          hosts:
            - "billing.ucode.co"
resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
nodeSelector: {}
tolerations: []
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: workload
              operator: In
              values:
                - "ucode-prod"
